name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Engine tests
        run: npm run test:engine

      - name: Serverless proxy tests
        run: npm run test:api

      - name: Production build
        run: npx vite build

      - name: No secrets in the client bundle
        run: |
          # A client_secret assigned a literal value.
          if grep -rEn "client_secret['\"]?[[:space:]]*[:=,][[:space:]]*['\"][A-Za-z0-9_-]{16,}" dist/assets; then
            echo "A client secret was found in the browser bundle." && exit 1
          fi
